<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>calculator</title>
</head>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: sans-serif;
  }

  body {
    width: 100%;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .calculator {
    border: 1px solid black;
    padding: 20px;
    border-radius: 16px;
    background-color: transparent;
    box-shadow: 0px 3px 15px black;
  }

  input {
    width: 320px;
    border: none;
    padding: 24px;
    margin: 10px;
    background-color: transparent;
    box-shadow: 0px 3px 15px black;
    font-size: 40px;
    text-align: right;
    cursor: pointer;
  }

  input::placeholder {
    color: black;
  }

  button {
    border: none;
    width: 60px;
    height: 60px;
    margin: 10px;
    border-radius: 50%;
    background-color: transparent;
    cursor: pointer;
    font-size: 20px;
    box-shadow: 8px 8px 15px black;

  }

  #equal_btn {
    background-color: orange;
  }

  .operator {
    background-color: rgb(130, 164, 130);
  }
</style>

<body>
  <div class="calculator">
    <input type="text" readonly placeholder="0" id="input_box">
    <div>
      <button class="operator">AC</button>
      <button class="operator">DEL</button>
      <button class="operator">%</button>
      <button class="operator">/</button>

    </div>
    <div>
      <button class="number">7</button>
      <button class="number">8</button>
      <button class="number">9</button>
      <button class="operator">*</button>

    </div>
    <div>
      <button class="number">4</button>
      <button class="number">5</button>
      <button class="number">6</button>
      <button class="operator">-</button>

    </div>
    <div>
      <button class="number">1</button>
      <button class="number">2</button>
      <button class="number">3</button>
      <button class="operator">+</button>

    </div>
    <div>
      <button class="number">00</button>
      <button class="number">0</button>
      <button class="operator">.</button>
      <button id="equal_btn">=</button>

    </div>
  </div>

  <script>


    let opt = ["+", "-", "/", "%", "*"]
    let input = document.getElementById('input_box')
    let number = document.querySelectorAll('.number')
    let equal_btn = document.getElementById('equal_btn')
    let operator = document.querySelectorAll('.operator')
    let string = ""
    let result = 0

    equal_btn.addEventListener("click", (e) => {
      try {

        if (e.target.innerHTML == "=") {
          string = eval(string)
          string = string == undefined ? "0" : String(string)
          result = Number(string)
          input.value = (string)


        }

      }

      catch (err) {
        input.value = 0
      }
    })
    number.forEach(num => {
      num.addEventListener("click", (e) => {
        if (result == 0 || opt.includes(string.slice(-1))) {
          string += e.target.innerHTML
          input.value = string
        }
        else {
          result = 0
          string = e.target.innerHTML
          input.value = string
        
        }
      })

    })

    operator.forEach(opr => {
      opr.addEventListener("click", (e) => {
        if (e.target.innerHTML == "AC") {
          result = 0
          string = ""
          input.value = string
        }
        else if (e.target.innerHTML == "DEL") {
          if (result != 0) {
            result = 0
            string = ""
            input.value = string
          } else {

            string = string.substring(0, string.length - 1)
            input.value = string
          }
        }
        else {
          if (result != 0 || string != "") {
            if (string.slice(-1) == e.target.innerHTML) {
              input.value = string
            }
            else if (opt.includes(e.target.innerHTML) && opt.includes(string.slice(-1))) {
              input.value = string.slice(0, string.length - 1) + e.target.innerHTML
              console.log(string.slice(0, string.length - 1))
            }

            else {
              string += e.target.innerHTML
              input.value = string
            }
          }

        }
      })
    })


  </script>

</body>

</html>
